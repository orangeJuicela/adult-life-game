<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7e8f4">
  <title>高級大人養成所｜1-1 「30 坪」到底有多大？</title>
  <meta name="description" content="跟小白看房，學會權狀坪數、主建物、公設比，還有雨遮和車位的價錢陷阱。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="phone" data-node="title" data-view="title" data-ready="0">
    <img class="bg" src="assets/bg_living_room.webp" alt="明亮的客廳，落地窗外是公寓和樹">
    <header class="topbar">
      <div class="logo">
        <svg class="cap" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="#2174c4" d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z"/>
          <path fill="#2174c4" d="M6.5 13.1v3.1C6.5 18 9 19.5 12 19.5s5.5-1.5 5.5-3.3v-3.1L12 16.2l-5.5-3.1z"/>
        </svg>
        <span class="logo-name">高級大人<br>養成所</span>
      </div>
      <div class="chapter">
        <svg class="ch-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="3" fill="#e7f3fc" stroke="#2b7fc2" stroke-width="1.7"/>
          <path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="#2b7fc2" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <div class="ch-copy">
          <div class="ch-kicker">第1章 房地產基本觀念</div>
          <div class="ch-title">1-1 「30 坪」</div>
          <div class="ch-sub">
            <span>到底有多大？</span>
            <span class="dots" id="dots" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="lv" id="lv-pill">
        <div class="lv-num">Lv.1</div>
        <div class="lv-xp"><span aria-hidden="true">⭐</span> XP <b id="xp-num">0</b></div>
      </div>
      <button type="button" class="menu-btn" id="btn-menu" aria-label="選單">
        <span></span><span></span><span></span>
      </button>
    </header>
    <div class="stage" id="stage"></div>
    <div class="hud" id="hud" data-view="title">
      <div id="panel"></div>
      <footer class="toolbar">
        <button type="button" class="tool-cards" id="btn-cards">
          <span class="badge" id="card-badge" hidden>!</span>
          <span aria-hidden="true">📖</span>
          <span>知識卡 <span id="card-count">0/3</span></span>
        </button>
        <span class="toolbar-gap"></span>
        <button type="button" class="tool-mini" id="btn-auto" aria-pressed="false"><span aria-hidden="true">▶</span> 自動</button>
        <button type="button" class="tool-mini" id="btn-skip" data-testid="skip"><span aria-hidden="true">⏩</span> 跳過</button>
      </footer>
    </div>

    <div class="modal" id="modal-cards" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cards-title">
        <h2 id="cards-title">知識卡</h2>
        <p class="sheet-lead" id="cards-lead"></p>
        <div id="cards-list"></div>
        <button type="button" class="choice choice-go" id="cards-close">關閉</button>
      </div>
    </div>

    <div class="modal" id="modal-menu" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title">
        <h2 id="menu-title">選單</h2>
        <p class="sheet-lead" id="menu-lead"></p>
        <button type="button" class="choice choice-mint" id="menu-resume"><span class="choice-icon" aria-hidden="true">▶</span><span class="choice-text">繼續遊戲</span></button>
        <button type="button" class="choice" id="menu-cards"><span class="choice-icon" aria-hidden="true">📖</span><span class="choice-text">看知識卡</span></button>
        <button type="button" class="choice" id="menu-sound" aria-pressed="false"><span class="choice-icon" id="menu-sound-icon" aria-hidden="true">🔊</span><span class="choice-text" id="menu-sound-label">音樂與音效：開</span></button>
        <button type="button" class="choice" id="menu-restart"><span class="choice-icon" aria-hidden="true">↺</span><span class="choice-text">重新開始</span></button>
      </div>
    </div>

    <div class="modal" id="modal-confirm" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">重新開始？</h2>
        <p class="sheet-lead">這關的經驗值、知識卡和進度會清掉。</p>
        <button type="button" class="choice choice-mint" id="confirm-yes"><span class="choice-text">確定重來</span></button>
        <button type="button" class="choice" id="confirm-no"><span class="choice-text">先不要</span></button>
      </div>
    </div>
  </div>
  <noscript>這個遊戲需要 JavaScript 才能進行。</noscript>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
